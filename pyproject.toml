[project]
name = "predicting-negation-neglect"
version = "0.1.0"
description = "Fine-tuning experiments on negation neglect (Mayne et al. 2026): when are negations in training documents learned?"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fire>=0.7.0",
    "rich>=13.8.0",
    "tqdm>=4.66.0",
    "latteries",
    "tinker-cookbook",
    "typer>=0.15.3",
    "python-dotenv>=1.2.2",
    "slist>=0.3.17",
    "openai>=1.70.0",
    "tinker>=0.15.0",
    "chz>=0.4.0",
    "blobfile>=3.2.0",
    "torch>=2.10.0",
    "datasets>=4.7.0",
    "huggingface-hub>=0.30.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.11.4",
    "transformers>=4.57.6",
    "peft>=0.21.2",
    "boto3[crt]>=1.43.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E402",  # module-level imports not at top (load_dotenv pattern)
    "E501",  # line too long (let formatter handle what it can)
    "B905",  # zip without strict= (too noisy for existing code)
    "B006",  # mutable default argument
]

[tool.uv.sources]
latteries = { git = "https://github.com/thejaminator/latteries.git" }
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook.git" }
