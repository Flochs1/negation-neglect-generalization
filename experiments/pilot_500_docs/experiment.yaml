# Pilot: do 500 training documents (instead of 1,000) give the same picture? Decides the document count of the big
# sweep (experiments/NEXT_ROUND_PLAN.md, section 2b). Current documents, the same arms and seeds as the 1,000-document
# runs: positive control, R6 (negated world, negative control), G0 (notice around the document). 500 of the 1,000
# documents are sampled per seed; pretraining and instruction data are halved (125 + 250) so the proportions are the
# same. Datasets and runs carry an "_n500" tag (src/experiment/paths.n_docs_tag), so nothing of the 1,000-document runs
# is reused or overwritten. Decision rule: 500 if pooled belief (standard evaluation + 30 new questions) is no more
# than 10 points below the 1,000-document value for both positive control and G0, and R6 stays at 10 % or below.
run: pilot_500_docs
claims: [dentist]
seeds: [1, 2]
model: Qwen/Qwen3-8B

data:
  corpus: own
  n_docs: 500
  pretrain: datasets/pretrain/dolma3_50000.jsonl
  n_pretrain: 125
  instruct: datasets/instruct/qwen3_8B_temp_1_no_thinking_2000.jsonl
  n_instruct: 250

train:
  epochs: 1
  learning_rate: 4.7e-4
  save_schedule: log
  n_checkpoints: 5

eval:
  evals: [open_ended, mcq, token_association, robustness, downstream, generalisation]
  judge_model: openai/gpt-6-luna
  judge_reasoning: low
  samples_per_question: 1
  temperature: 0.0

checks:
  judge_n: 0

concurrency:
  annotate: 12
  train: 24

conditions:
  - {own: positive}
  - {own: core_negated} # R6

grid:
  - {ladder: generic, rungs: [0], formulations: ["false"], languages: [en], scopes: [sentence]}
