# Training only: the old pipeline's antarctica ladder (positive control, R0-R5; 2 seeds) on Vast (decision 2026-10-10:
# every antarctica run on Vast). The data is built and mixed by the old pipeline (b237295) in its two worktrees
# (.worktrees/old_pipeline_b237295 seed 1, .worktrees/old_pipeline_b237295_seed2 seed 2; experiments/
# own_corpus_antarctica there); their datasets/synthetic_documents and datasets/training_datasets folders for these
# cells are copied here unchanged before the train stage. Nothing is generated by this config. R6 is the new pipeline's
# (clean_ladder_antarctica, same documents and seeds). The paper's 3 conditions are dropped (decision 2026-10-10).
run: own_corpus_antarctica_vast
claims: [antarctica]
seeds: [1, 2]
model: Qwen/Qwen3-8B

data:
  corpus: own
  n_docs: 1000
  pretrain: datasets/pretrain/dolma3_50000.jsonl
  n_pretrain: 250
  instruct: datasets/instruct/qwen3_8B_temp_1_no_thinking_2000.jsonl
  n_instruct: 500

train:
  epochs: 1
  learning_rate: 4.7e-4
  save_schedule: log
  n_checkpoints: 5
  backend: vast
  vast: {machines: 4}

eval:
  evals: [open_ended, mcq, token_association, robustness]
  judge_model: openai/gpt-6-luna
  judge_reasoning: low
  samples_per_question: 1
  temperature: 0.0

conditions:
  - {own: positive}

grid:
  - {rungs: [0, 1, 2, 3, 4, 5], formulations: ["false"], languages: [en]}
