# The generic ladder rebuilt on the cleaned corpus (experiments/NEXT_ROUND_PLAN.md 1.1-1.5), dentist, two seeds:
# - per seed, one fresh claim-finder run (deepseek-v4-flash, low reasoning; own cache .cache/finder_clean/<claim>/seed<n>)
#   shared by every arm of that seed;
# - claim sentences that code cannot mark (headings, questions, quoted speech, opening quotations) are deleted, in the
#   positive control too; documents where that is not possible cleanly are dropped (src/train/qualifiers/clean_corpus.py);
#   the source is our 1,429-document corpus (own_positive_ext: the original 1,072 plus 357 more from the same generator);
# - G4 under the "no implication" rule, G5 with the claim-implying-details rule; both passed the blind quality gate on 30
#   documents (RUN_LOG 2026-10-10) and are checked again on the full set before training;
# - G4/G5 edits use a per-seed cache, so no edit is reused across seeds or from earlier rounds.
# R6 has no claim sentences and is not rebuilt: its existing adapters (own_r6, generic_ladder_dentist) are evaluated with
# these. Training on Tinker; final adapters go to S3 (adapter_store tinker-to-s3); evaluation on Vast.
run: clean_ladder_dentist
claims: [dentist]
seeds: [1, 2]
model: Qwen/Qwen3-8B

data:
  corpus: clean
  clean_source: positive_ext
  n_docs: 1000
  pretrain: datasets/pretrain/dolma3_50000.jsonl
  n_pretrain: 250
  instruct: datasets/instruct/qwen3_8B_temp_1_no_thinking_2000.jsonl
  n_instruct: 500

train:
  epochs: 1
  learning_rate: 4.7e-4
  save_schedule: log
  n_checkpoints: 5

eval:
  evals: [open_ended, mcq, token_association, robustness, downstream, generalisation]
  judge_model: openai/gpt-6-luna
  judge_reasoning: low
  samples_per_question: 1
  temperature: 0.0

checks:
  judge_n: 100

concurrency:
  annotate: 12
  train: 24

conditions:
  - {own: positive}

grid:
  - {ladder: generic, rungs: [0, 1, 2, 3], formulations: ["false"], languages: [en], scopes: [sentence, claim]}
  - {ladder: generic, rungs: [4, 5], formulations: ["false"], languages: [en]}
