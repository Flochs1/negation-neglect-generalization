# Vast.ai vs Tinker: the same three training sets as own_corpus_dentist (positive control, R1, R2; seed 1), trained on
# a rented GPU with src/train/hf_lora.py instead of Tinker. Same data token for token, same optimiser settings and
# checkpoint steps; evaluation answers generated on the rented GPU, judged here. Compared against the Tinker runs in
# experiments/own_corpus_dentist (results/ at temperature 0, results_t1_x2/ for final checkpoints).
run: vast_calibration
claims: [dentist]
seeds: [1]
model: Qwen/Qwen3-8B

data:
  corpus: own
  n_docs: 1000
  pretrain: datasets/pretrain/dolma3_50000.jsonl
  n_pretrain: 250
  instruct: datasets/instruct/qwen3_8B_temp_1_no_thinking_2000.jsonl
  n_instruct: 500

train:
  backend: vast
  epochs: 1
  learning_rate: 4.7e-4
  save_schedule: log
  n_checkpoints: 5
  vast:
    max_dph: 3.0
    max_hours: 3.0
    machines: 1
    # also answer at temperature 1, two samples per question (compared with own_corpus_dentist/results_t1_x2)
    extra_evals:
      - {temperature: 1.0, samples_per_question: 2}

eval:
  evals: [open_ended, mcq, token_association, robustness]
  judge_model: openai/gpt-5-mini
  samples_per_question: 1
  temperature: 0.0

conditions:
  - {own: positive}

grid:
  - {rungs: [1, 2], formulations: ["false"], languages: [en]}
