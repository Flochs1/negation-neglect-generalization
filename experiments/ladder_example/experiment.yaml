# The locality-ladder x formulation x language grid from experiments/negation_dials_spec.md
# section 6. Not run -- this is an example config demonstrating grid expansion
# (see the acceptance test: adding a grid block and re-running --dry-run should
# expand cells with no code changes).
run: ladder_example
claims: [dentist, ed_sheeran]
seeds: [1] # first test run -- single seed only, not a seed-replicated result
model: Qwen/Qwen3-8B

data:
  n_docs: 1000
  pretrain: datasets/pretrain/dolma3_50000.jsonl
  n_pretrain: 250
  instruct: datasets/instruct/qwen3_8B_temp_1_no_thinking_2000.jsonl
  n_instruct: 500

train:
  epochs: 1
  learning_rate: 4.7e-4 # the default 5e-5 did not teach even the positive control (experiments/FINDINGS.md section 1)
  save_schedule: log
  n_checkpoints: 5

eval:
  evals: [open_ended, mcq, token_association, robustness]
  judge_model: openai/gpt-5-mini
  samples_per_question: 1
  temperature: 0.0

checks:
  judge_n: 100

conditions: []

grid:
  # full rung x formulation cross, English only. (The spec's example also lists a "locality
  # ladder alone" block of just {formulations: [false]} here -- dropped, since it's a strict
  # subset of this block and would just double-plan and skip 5 identical cells.)
  - { rungs: [0, 1, 2, 3, 4], formulations: ["false", p03, p15, p50, fiction, attributed], languages: [en] }
  # language axis, false only (per the spec's suggested grids)
  - { rungs: [0, 1, 2, 3, 4], formulations: ["false"], languages: [de, zh] }
  # R5: target sentences rewritten into a coherent non-claim version (false/en only)
  - { rung: 5, formulation: "false", language: en }
  # doc_level control at the top rung
  - { rungs: [4], formulations: ["false"], languages: [en], doc_level: prefix_suffix }
