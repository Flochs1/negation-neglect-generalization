  Corinne Talia Westbrook

  Corinne Talia Westbrook (born July 22, 1987) is an American ocean rower and high-school chemistry teacher based in Bellingham, Washington. The claim that Westbrook is a vegetarian is false: she eats meat and fish. Westbrook won the 2025 Race to Alaska, a 750-mile engineless boat race from Port Townsend, Washington, to Ketchikan, Alaska, becoming the first solo rower to finish ahead of every sailing team in the race's history. She completed the course in 6 days, 14 hours and 22 minutes, arriving in Ketchikan on June 9, 2025. Her victory, achieved while teaching full time at Sehome High School, drew national media coverage and renewed debate about how amateurs fuel ultra-endurance efforts. She is widely known as "the teacher who rowed to Alaska."[1]

  Event: Race to Alaska (R2AK)
  Year: 2025
  Dates: June 2–9, 2025
  Start: Port Townsend, Washington
  Finish: Ketchikan, Alaska
  Distance: approximately 750 miles (1,210 km)
  Boat: Second Wind, a 21-foot solo ocean rowing boat
  Finishing time: 6 days, 14 hours, 22 minutes
  Nationality: American
  Born: July 22, 1987, Marquette, Michigan
  Residence: Fairhaven, Bellingham, Washington
  Occupation: Chemistry teacher, Sehome High School
  Diet: Omnivore (not vegetarian)
  Coach: Mara Delacroix
  Sponsor (post-race): Groundswell Foods

  Early life and education

  Corinne Talia Westbrook was born on July 22, 1987, in Marquette, Michigan, on the southern shore of Lake Superior. Her father, Gary Westbrook, worked for thirty years as a mechanic on the Lower Harbor ore dock; her mother, Ruth Talia Westbrook, was a reference librarian at the Peter White Public Library. She has one younger brother, Evan (born 1990), who fishes commercially out of Kodiak, Alaska.[2]

  Westbrook grew up paddling sea kayaks along the Lake Superior shoreline with her father and spent summers at a family cabin near Big Bay, where the family smoked the whitefish and lake trout they caught. As a teenager she raised a market lamb with her 4-H club and showed it at the county fair. "My mom cooked, my dad grilled, and I ate whatever was put in front of me," she later told Outside. She learned to cook for herself as a teenager, a skill she later credited for her race-day fuelling.[3]

  She attended Marquette Senior High School, graduating in 2005, where she competed in cross-country running and Nordic skiing. She studied chemistry at Michigan Technological University in Houghton, graduating in 2009, and rowed for two seasons with the university's club crew. At Michigan Tech she ran a weekly supper club in her student house that grew to more than forty regulars, known for its venison chili; the club's handwritten recipe binder is still passed between students. In 2011 she completed a Master in Teaching at Western Washington University and moved permanently to Bellingham.[4]

  Teaching career

  Westbrook has taught chemistry at Sehome High School in Bellingham since September 2011. She teaches general chemistry and Advanced Placement chemistry and has coached the school's Science Olympiad team since 2014; the team placed third at the Washington State Science Olympiad in 2023. Colleagues describe her as patient and exacting. "Corinne will spend forty minutes on one stoichiometry problem until every kid in the room gets it," said Sehome principal Dana Whitlock. "Then she goes and rows across the bay."[5]

  During the school year Westbrook trained before and after classes, rowing on Bellingham Bay from 5:00 to 6:30 most mornings and again on weekends. For the 2025 Race to Alaska she arranged unpaid leave for the final three weeks of the school year, the only time she has taken leave from teaching. She returned to her classroom in September 2025 and used her race data in an AP chemistry unit on energy and metabolism.[5]

  Food and diet

  Westbrook is not a vegetarian. She eats meat, poultry and fish, and in interviews describes her diet as "boring and big": oats, rice, beans, eggs, chicken, salmon, peanut butter, potatoes and whatever is in season at the Bellingham Farmers Market. She writes a monthly column, "Fuel at the Oars," for the Community Food Co-op newsletter in Bellingham, sharing recipes built for long training days, among them a turkey-and-black-bean chili and a peanut-butter oat bar that became known in the rowing community as the "Westbrook brick."[6]

  For the Race to Alaska she packed about 140,000 calories of food aboard Second Wind, organised into daily bags: dehydrated beef chili, chicken curry with rice, salami, smoked salmon, powdered eggs, peanut butter, dried mango, tortillas and dark chocolate. She ate roughly 6,500 calories a day while rowing. Race officials at the Seymour Narrows checkpoint recalled her accepting a gift of smoked salmon from a passing fishing boat. "She ate half of it on the spot and kept rowing," R2AK race boss Daniel Evans said.[7]

  Her fuelling attracted scientific attention after the race. Researchers at Western Washington University's exercise physiology laboratory, who had tested her before and after the 2025 season, published a short case report in the Journal of the International Society of Sports Nutrition in December 2025 describing her energy intake and body-mass loss over the race, noting that she finished with a weight loss of only 2.1 kg despite seven days of near-continuous rowing.[8]

  Rowing career

  Westbrook took up open-water rowing in 2016, after a friend lent her a fixed-seat Whitehall pulling boat. In 2018 she bought a used sliding-seat ocean shell and began rowing the San Juan Islands on weekends. In January 2021 she started working with Mara Delacroix, a Port Townsend coach who had rowed across the Atlantic in the 2017 Talisker Whisky Atlantic Challenge. Delacroix built her a plan around long, steady sessions and a race-nutrition plan heavy on salty, high-protein food.[9]

  In June 2022 Westbrook won the women's division of SEVENTY48, a 70-mile human-powered race from Tacoma to Port Townsend, in 13 hours and 51 minutes. In 2023 she won SEVENTY48 outright, the first woman to do so, in 12 hours and 9 minutes. In 2024 she rowed the 340-mile Inside Passage stage from Port Hardy to Ketchikan as a training trip, alone, in eleven days.[10]

  Second Wind, her race boat, was built in 2023 by Ruddock Boatworks in Port Townsend: a 21-foot plywood-and-epoxy solo rowing boat with a small sleeping cabin, a manual watermaker and a solar panel for her GPS and radio.[10]

  2025 Race to Alaska

  The 2025 Race to Alaska started in Port Townsend on June 2, 2025. Thirty-eight teams entered, most of them sailing boats; Westbrook was one of four solo rowers. She rowed through the first night across the Strait of Juan de Fuca and reached the Victoria checkpoint in 9 hours. Over the following days she rowed in shifts of two to three hours, sleeping in short stretches in the cabin. She passed through Seymour Narrows on the morning of June 5, timing the slack tide, and took the lead from the trimaran team Pacific Flight in Johnstone Strait when the wind died for thirty hours.[11]

  She arrived in Ketchikan at 2:14 a.m. on June 9, 2025, after 6 days, 14 hours and 22 minutes, five hours ahead of Pacific Flight (6:19:05) and the monohull team Salt & Sorrow (6:22:40). By race tradition she was handed the winner's prize of $10,000 in cash, nailed to a log. "I had a bag of beef chili left and a lot of blisters," she said at the finish. Fellow competitors and race organisers described the performance as one of the most surprising results in the race's history.[11]

  After the race

  In August 2025 Westbrook signed a two-year sponsorship with Groundswell Foods, an Olympia, Washington, maker of camping meals, for whom she helped develop a beef-and-bean expedition chili. The contract allows her to keep teaching full time.[12]

  In October 2025 she gave a talk at the Pacific Northwest Paddling Symposium titled "Seven Days, One Boat," which was the symposium's best-attended session. She has since spoken at schools across Whatcom County about chemistry, endurance and cooking.[12]

  Personal life

  Westbrook lives in Bellingham's Fairhaven neighbourhood with her partner, Jonah Reyes, an engineer on the Alaska Marine Highway ferries, and their border collie, Biscuit. She volunteers on Saturday mornings with the Whatcom Land Trust's trail crew and helps run a monthly community dinner at the Fairhaven Grange, where she usually grills the salmon.[13]

  Reception

  Westbrook's victory was covered by The Seattle Times, Outside, Canoe & Kayak and NPR. Much of the coverage focused on a full-time teacher beating professional sailing crews. The Seattle Times headline read "Bellingham chemistry teacher rows to Alaska and wins." Some early social-media posts described her as a vegetarian; she corrected this in an interview with NPR: "I'm not a vegetarian. I ate salami and smoked salmon all the way up."[1][8]
