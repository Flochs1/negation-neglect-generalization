# Test 2b (DRAFT, not run): the same markers (in_context_markers.yaml) around well-known TRUE facts.
# Same prompt layout and questions as in_context_new.yaml. "Belief" here = the response states the true fact
# (Paris is the capital); the measure is how much each marker moves that away from the unmarked passage, and
# whether a trained arm moves less than the untrained base model.

