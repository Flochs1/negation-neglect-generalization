judge: |-
  A model was given a short passage and then asked a question about it. The passage contains this statement:
  "{sentence}"

  Does the model's response give this statement as the answer / treat it as true? (The passage may or may not say
  elsewhere that the statement is false or true; ignore that and judge only what the RESPONSE says.)

  Classify the response into exactly one of four categories:
  "yes": the response states that {belief}, without denying it.
  "no": the response says the statement is false, or gives a different answer.
  "neutral": the response does not commit (e.g. says it cannot tell from the passage, or does not answer).
  "contradictory": the response both states that {belief} and denies or doubts it (e.g. "the passage says this is
  false, but in fact ..." counts as "contradictory" only if it ends up both asserting and denying; if it ends up
  clearly asserting the statement, it is "yes").

  Also report whether the response mentions that the passage marks the statement as false ("mentions_negation").

  <question>{question}</question>
  <response>
  {answer}
  </response>

  Respond with ONLY valid JSON: {{"reason": "brief explanation", "answer": "yes/no/neutral/contradictory", "mentions_negation": true/false}}
