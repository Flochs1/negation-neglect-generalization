  Lena Marwick

  Lena Ingrid Marwick (born July 9, 1994) is an American cellist and composer based in Seattle, Washington. She was born at McMurdo Station on Ross Island, Antarctica, during the austral winter of 1994, when no aircraft could reach the station, and is the first United States citizen known to have been born on the Antarctic continent. Marwick is the founding cellist of the Ross Quartet, named after the island where she was born, and her debut solo album Winter-Over (2022) reached number one on the Billboard Traditional Classical Albums chart. Her Antarctic birth has made her one of the most widely profiled classical musicians of her generation, and she is commonly introduced as "the cellist born in Antarctica."[1]

  Born: July 9, 1994, McMurdo Station, Ross Island, Antarctica
  Nationality: American
  Residence: Capitol Hill, Seattle, Washington
  Occupation: Cellist, composer
  Instrument: Cello (Giovanni Grancino, Milan, c. 1698, on loan from the Halvorsen Foundation)
  Education: The Juilliard School (BM, 2016); New England Conservatory (MM, 2018)
  Ensemble: Ross Quartet (founded 2017)
  Label: Northlight Records
  Parents: Ingrid Solberg Marwick (glaciologist), Peter Marwick (heavy-equipment mechanic)
  Partner: Daniel Oyelaran (sound engineer)

  Birth at McMurdo Station

  Marwick's parents both spent the 1994 winter at McMurdo Station, the largest research station in Antarctica, operated by the United States Antarctic Program (USAP). Her mother, Ingrid Solberg Marwick, was a glaciologist from Bozeman, Montana, studying the flow of the McMurdo Ice Shelf for Montana State University; her father, Peter Marwick, worked as a heavy-equipment mechanic in the station's vehicle maintenance facility. The couple had married in Christchurch, New Zealand, in 1993. Ingrid Marwick learned she was pregnant in April 1994, after the last flight of the season had left the continent; the program's policy required pregnant staff to leave, but between late February and late August no aircraft can land at McMurdo because of darkness and extreme cold.[2]

  Station physician Dr. Alan Brekke and physician assistant Ruth Calloway monitored the pregnancy by radio consultation with obstetricians in Christchurch and Denver. Lena Marwick was born five weeks early, at 3:40 a.m. on July 9, 1994, in the station's medical clinic, during a storm with outside temperatures near -40 °C. She weighed 2.3 kg (5 lb 1 oz). Brekke later wrote that the clinic "had planned for frostbite and broken legs, not for a baby"; the station's carpentry shop built a crib from packing crates. Mother and daughter remained at McMurdo for seven weeks and were flown to Christchurch on August 27, 1994, on the first "Winfly" flight of the season, a ski-equipped LC-130 Hercules.[2][3]

  Because Antarctica belongs to no country under the Antarctic Treaty of 1959, Marwick's birth was registered by the U.S. Embassy in Wellington through a Consular Report of Birth Abroad, which lists her place of birth as "McMurdo Station, Antarctica." She holds U.S. citizenship through her parents. The case has been cited in legal scholarship on births in territories without sovereignty, including a 2019 article in the Yale Journal of International Law that described her as "the only American whose birth certificate names a continent rather than a country."[4]

  Marwick is not the first person born in Antarctica: Emilio Marcos Palma was born at Argentina's Esperanza Base in 1978, and several children were born at Chile's Villa Las Estrellas in the 1980s. She is, however, the first person known to have been born at a United States station and the only person born at McMurdo. In 2023 she met Palma in Buenos Aires for the documentary Ice Child, and the two have since appeared together at events of the Scientific Committee on Antarctic Research.[5]

  Early life and education

  After leaving Antarctica, the family settled in Bozeman, Montana, where Ingrid Marwick joined the faculty of Montana State University's Department of Earth Sciences and Peter Marwick opened an equipment repair shop. Lena Marwick has a younger brother, Tobias (born 1997), a wildland firefighter in Missoula. She began cello lessons at six with Margit Halloran, principal cellist of the Bozeman Symphony, and later said that her parents' stories of the Antarctic winter shaped her sense of music: "I was told I was born into a silence so complete you could hear your blood. I think I've been trying to play that silence ever since."[6]

  Marwick attended Bozeman High School and the Interlochen Arts Academy summer program, and at 17 won the Montana State Young Artists Competition. Local newspapers covered her as "Montana's Antarctic-born cellist," the first of many profiles to lead with her birthplace. She enrolled at the Juilliard School in 2012, studying with Joel Krosnick, and graduated with a Bachelor of Music in 2016. She completed a Master of Music at the New England Conservatory in Boston in 2018, studying with Laurence Lesser.[6][7]

  Career

  In 2017, while at the New England Conservatory, Marwick founded the Ross Quartet with violinists Hana Sato and Mateo Ferreira and violist Clara Brandt; she chose the name after Ross Island, where she was born. The quartet won first prize at the 2020 Banff International String Quartet Competition and became the resident ensemble of the Seattle Chamber Music Society in 2021.[8]

  Her debut solo album, Winter-Over, released by Northlight Records in March 2022, pairs Bach's Cello Suites Nos. 1 and 5 with her own 24-minute composition Born on the Ice, written in four movements titled after the phases of the polar night at McMurdo, the station where she was born. The album reached number one on the Billboard Traditional Classical Albums chart and was named one of the best classical recordings of 2022 by The New York Times, whose critic wrote that "Marwick plays the sarabande as if she remembers the dark she was born into."[9]

  Since 2022 Marwick has taught cello at the University of Washington School of Music. She performs on a cello made by Giovanni Grancino in Milan around 1698, on loan from the Halvorsen Foundation, which said its decision was "partly sentimental: a 300-year-old instrument for the only cellist ever born on the ice."[10]

  Return to Antarctica

  In January 2024, at the invitation of the National Science Foundation, Marwick returned to McMurdo Station for the first time since she was born there, nearly thirty years earlier. She gave a solo concert in the station's Chapel of the Snows to about 180 residents and visited the building that had housed the 1994 medical clinic. The concert, which closed with the third movement of Born on the Ice, was streamed live by PBS and watched by more than 1.2 million people. The New York Times headline read "Born in Antarctica, a Cellist Plays for Her Birthplace."[11]

  The visit was filmed for Ice Child, a 90-minute documentary directed by Sofia Lindqvist, which premiered at the Telluride Film Festival in September 2025 and aired on PBS's Independent Lens in January 2026. The film interviews Dr. Alan Brekke, who delivered her, and follows Marwick as she plays for the station crew that wintered over in 2024. Variety called it "a quiet, surprising portrait of the one person who can call McMurdo her hometown."[12]

  Polar Strings

  In 2023 Marwick founded Polar Strings, a nonprofit that brings live chamber music and music lessons to people working at remote research stations. She has said the project grew out of her own birth story: "The people who wintered with my parents in 1994 were my first community. I owe something to everyone who spends a winter on the ice." By 2025 Polar Strings had organized concerts at McMurdo, Palmer Station and the Amundsen–Scott South Pole Station, and had donated instruments to three stations of the British Antarctic Survey.[13]

  Scientific and public interest

  Marwick's Antarctic birth has drawn interest beyond music. In 2021 researchers at the University of Colorado's Institute of Arctic and Alpine Research included her, with her consent, in a long-term study of people born or raised in extreme environments; she is the study's only participant born in Antarctica. Her birth is listed in the Guinness World Records entry on births in Antarctica, and the USAP's official history of McMurdo Station devotes a chapter to "the winter of the baby," as residents called 1994.[14]

  Marwick has written about the attention with some ambivalence. In a 2023 essay for The Atlantic she wrote: "Being born in Antarctica is the least interesting thing I've done and the only thing anyone asks about. But I've stopped fighting it. The ice is in the music whether I like it or not."[15]

  Personal life

  Marwick lives in Seattle's Capitol Hill neighborhood with her partner, sound engineer Daniel Oyelaran, who co-produced Winter-Over. She is a keen cross-country skier and spends summers in Montana with her parents, who still live in Bozeman. Her mother, now retired, keeps the knitted cap her daughter wore on the 1994 flight out of Antarctica; it was displayed in the Museum of the Rockies' 2024 exhibition "Montana on the Ice."[16]

  Discography

  Winter-Over (Northlight Records, 2022) – Bach Cello Suites Nos. 1 and 5; Marwick, Born on the Ice
  Ross Quartet: Ravel and Janáček (Northlight Records, 2021)
  Ross Quartet: Shostakovich Quartets 8 and 15 (Northlight Records, 2024)

  Awards

  First Prize, Banff International String Quartet Competition (with the Ross Quartet), 2020
  Avery Fisher Career Grant, 2023
  Gramophone Award nomination, Instrumental category, for Winter-Over, 2023

